<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Halbwert</title>
<meta name="description" content="Halbwert – privates Substanz-Tagebuch für Harm Reduction: Einnahmen, Stimmung, Halbwertszeiten und Wechselwirkungs-Hinweise. Alle Daten bleiben auf deinem Gerät.">
<meta name="theme-color" content="#0b0f17">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Halbwert">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<style>
  :root {
    --bg: #f4f5f7; --card: #ffffff; --text: #111827; --muted: #6b7280;
    --border: #e5e7eb; --grid: #eceef1; --accent: #b45309; --accent-text: #ffffff;
    --ok: #15803d; --warn: #dc2626; --chip: #f3f4f6; --sel: #fef3c7;
    --sev3: #dc2626; --sev2: #ea580c; --sev1: #ca8a04;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0b0f17; --card: #151b26; --text: #e5e7eb; --muted: #9ca3af;
      --border: #263041; --grid: #1e2633; --accent: #f59e0b; --accent-text: #111827;
      --ok: #22c55e; --warn: #f87171; --chip: #1f2937; --sel: #3a2a0a;
      --sev3: #f87171; --sev2: #fb923c; --sev1: #facc15;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0b0f17; --card: #151b26; --text: #e5e7eb; --muted: #9ca3af;
    --border: #263041; --grid: #1e2633; --accent: #f59e0b; --accent-text: #111827;
    --ok: #22c55e; --warn: #f87171; --chip: #1f2937; --sel: #3a2a0a;
      --sev3: #f87171; --sev2: #fb923c; --sev1: #facc15;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; }
  body {
    background: var(--bg); color: var(--text);
    font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    padding-bottom: calc(76px + env(safe-area-inset-bottom));
  }
  header {
    position: sticky; top: 0; z-index: 5; background: var(--bg);
    padding: calc(10px + env(safe-area-inset-top)) 16px 8px;
    border-bottom: 1px solid var(--border);
  }
  header .bar { max-width: 640px; margin: 0 auto; display: flex; align-items: center; gap: 8px; }
  header h1 { margin: 0; font-size: 19px; flex: 1; min-width: 0; }
  header .sub { color: var(--muted); font-size: 13px; font-weight: 400; display: block; }
  main { max-width: 640px; margin: 0 auto; padding: 12px 16px; }
  nav {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 10;
    display: flex; background: var(--card); border-top: 1px solid var(--border);
    padding-bottom: env(safe-area-inset-bottom);
  }
  nav button {
    flex: 1; background: none; border: 0; color: var(--muted);
    padding: 9px 0 11px; font-size: 11px; cursor: pointer;
  }
  nav button span { display: block; font-size: 20px; line-height: 1.25; }
  nav button.active { color: var(--accent); font-weight: 600; }
  .card {
    background: var(--card); border: 1px solid var(--border); border-radius: 14px;
    padding: 14px; margin-bottom: 12px;
  }
  .row { display: flex; align-items: center; gap: 10px; }
  .grow { flex: 1; min-width: 0; }
  .muted { color: var(--muted); font-size: 13px; }
  h2 { font-size: 15px; margin: 18px 0 8px; display: flex; align-items: center; gap: 8px; }
  h2:first-child { margin-top: 4px; }
  h2 .muted { font-weight: 400; }
  .dot { width: 12px; height: 12px; border-radius: 50%; flex: none; }
  .name { font-weight: 600; overflow-wrap: anywhere; }
  .btn {
    border: 1px solid var(--border); background: var(--chip); color: var(--text);
    border-radius: 10px; padding: 9px 14px; font-size: 14px; cursor: pointer;
    text-decoration: none; display: inline-block; font-family: inherit;
  }
  .btn.primary { background: var(--accent); color: var(--accent-text); border-color: var(--accent); font-weight: 600; }
  .btn.danger { color: var(--warn); }
  .btn.small { padding: 5px 10px; font-size: 13px; }
  .btn.icon { padding: 6px 12px; font-size: 18px; line-height: 1; }
  .btn.on { background: var(--accent); color: var(--accent-text); border-color: var(--accent); }
  .done { color: var(--ok); font-weight: 600; font-size: 14px; white-space: nowrap; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip { border: 1px solid var(--border); background: var(--chip); color: var(--text); border-radius: 999px; padding: 7px 12px; font-size: 14px; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; font-family: inherit; }
  .ix { background: var(--card); border: 1px solid var(--border); border-left: 4px solid var(--sev1); border-radius: 12px; padding: 10px 12px; margin-bottom: 8px; }
  .ix2 { border-left-color: var(--sev2); }
  .ix3 { border-left-color: var(--sev3); }
  .onb h3 { font-size: 22px; margin-bottom: 4px; }
  .onb ul { padding-left: 0; list-style: none; margin: 14px 0; }
  .onb li { display: flex; gap: 10px; margin-bottom: 12px; font-size: 14px; }
  .onb li span { font-size: 20px; line-height: 1.2; }
  .help a { color: var(--accent); font-weight: 600; text-decoration: none; }
  .help .entry a { white-space: nowrap; }
  .help .entry .grow { overflow-wrap: anywhere; }
  .chip.on { background: var(--accent); color: var(--accent-text); border-color: var(--accent); font-weight: 600; }
  label { display: block; font-size: 13px; color: var(--muted); margin: 10px 0 4px; }
  input, select, textarea {
    width: 100%; font: inherit; font-size: 16px; color: var(--text); background: var(--bg);
    border: 1px solid var(--border); border-radius: 10px; padding: 9px 10px;
  }
  textarea { min-height: 110px; resize: vertical; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 0 10px; }
  .grid4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 0 8px; }
  .days { display: flex; flex-wrap: wrap; gap: 6px; }
  .days label { margin: 0; display: flex; align-items: center; gap: 4px; padding: 6px 10px; border: 1px solid var(--border); border-radius: 999px; color: var(--text); }
  .days input { width: auto; }
  .empty { text-align: center; color: var(--muted); padding: 18px 8px; }
  .entry { padding: 10px 0; border-top: 1px solid var(--border); }
  .entry:first-child { border-top: 0; padding-top: 0; }
  .entry:last-child { padding-bottom: 0; }
  .actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
  .moods { display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px; }
  .mood { border: 2px solid transparent; background: var(--chip); border-radius: 12px; padding: 6px 0 4px; cursor: pointer; text-align: center; font-family: inherit; color: var(--muted); font-size: 11px; }
  .mood span { display: block; font-size: 28px; line-height: 1.2; filter: grayscale(.6); opacity: .7; }
  .mood.sel { border-color: var(--accent); background: var(--sel); color: var(--text); font-weight: 600; }
  .mood.sel span { filter: none; opacity: 1; }
  .cal { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
  .cal .h { text-align: center; font-size: 12px; color: var(--muted); padding-bottom: 2px; }
  .cal button { aspect-ratio: 1 / 1.1; border: 1px solid var(--border); background: var(--card); border-radius: 10px; color: var(--text); font: inherit; font-size: 13px; padding: 3px 0; cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: space-between; }
  .cal button.out { visibility: hidden; }
  .cal button.today { border-color: var(--accent); border-width: 2px; }
  .cal button .e { font-size: 17px; line-height: 1; min-height: 17px; }
  .cal button .m { display: flex; gap: 2px; min-height: 6px; }
  .cal button .m i { width: 5px; height: 5px; border-radius: 50%; display: block; }
  dialog {
    border: 1px solid var(--border); border-radius: 16px; background: var(--card); color: var(--text);
    width: min(560px, calc(100vw - 24px)); max-height: calc(100vh - 40px); padding: 16px;
  }
  dialog::backdrop { background: rgba(0,0,0,.5); }
  dialog h3 { margin: 0 0 6px; overflow-wrap: anywhere; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  td, th { text-align: left; padding: 6px 4px; border-top: 1px solid var(--border); }
  th { color: var(--muted); font-weight: 500; border-top: 0; }
  td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .notice { font-size: 13px; color: var(--muted); border-left: 3px solid var(--accent); padding: 6px 10px; margin: 10px 0; }
  .seg { display: flex; background: var(--chip); border-radius: 10px; padding: 3px; gap: 2px; }
  .seg button { flex: 1; border: 0; background: none; color: var(--muted); padding: 7px 0; border-radius: 8px; font: inherit; font-size: 13px; cursor: pointer; }
  .seg button.on { background: var(--card); color: var(--text); font-weight: 600; box-shadow: 0 1px 2px rgba(0,0,0,.15); }
  .stat { display: flex; gap: 12px; margin: 12px 0 4px; }
  .stat > div { flex: 1; }
  .stat .v { font-size: 26px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .chart { position: relative; touch-action: pan-y; }
  .chart svg { display: block; width: 100%; overflow: visible; }
  .tip { position: absolute; pointer-events: none; background: var(--text); color: var(--bg); font-size: 12px; padding: 5px 8px; border-radius: 8px; white-space: nowrap; transform: translate(-50%, -100%); display: none; }
  .bar-bg { height: 6px; background: var(--chip); border-radius: 3px; overflow: hidden; margin-top: 4px; }
  .bar-bg i { display: block; height: 100%; background: var(--accent); border-radius: 3px; }
  .pdftext { white-space: pre-wrap; font-size: 13px; background: var(--bg); border: 1px solid var(--border); border-radius: 10px; padding: 10px; max-height: 50vh; overflow: auto; }
  .pages canvas, .pages img { width: 100%; height: auto; border: 1px solid var(--border); border-radius: 6px; margin-bottom: 8px; background: #fff; }
  mark { background: var(--sel); color: inherit; border-radius: 3px; }
  .toast {
    position: fixed; left: 50%; bottom: calc(90px + env(safe-area-inset-bottom)); transform: translateX(-50%);
    background: var(--text); color: var(--bg); padding: 8px 14px; border-radius: 10px; font-size: 14px;
    opacity: 0; transition: opacity .2s; pointer-events: none; z-index: 20; max-width: calc(100vw - 32px);
  }
  .toast.show { opacity: 1; }
</style>
</head>
<body>
<header><div class="bar" id="hbar"></div></header>
<main id="view"></main>
<nav>
  <button data-tab="day" class="active"><span>☀︎</span>Tag</button>
  <button data-tab="history"><span>▦</span>Verlauf</button>
  <button data-tab="trends"><span>〰︎</span>Trends</button>
  <button data-tab="plan"><span>☰</span>Plan</button>
  <button data-tab="more"><span>⋯</span>Mehr</button>
</nav>
<dialog id="dlg"></dialog>
<div class="toast" id="toast"></div>
<script src="substances-db.js"></script>
<script src="interactions.js"></script>
<script src="app.js"></script>
</body>
</html>
